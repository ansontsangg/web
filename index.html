<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anson Tsang</title>
    <meta
      name="description"
      content="Anson Tsang - builder, thinker, writer."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="icon.png">
  </head>
  <body class="home-body">
    <!-- ─── Top Left: Handle ─────────────────────────────────── -->
    <a href="index.html" class="home-handle">@ansontsangg</a>

    <!-- ─── LinkedIn icon - top right ────────────────────────── -->
    <div class="home-top-right">
      <a
        href="https://www.linkedin.com/in/ansontsangg/"
        target="_blank"
        rel="noopener noreferrer"
        class="linkedin-icon-btn"
        aria-label="LinkedIn profile"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"
          />
        </svg>
      </a>
    </div>

    <!-- ─── LCR Layout: Text | Photo & Links | Clocks ───────── -->
    <main class="home-full">
      <!-- LEFT: intro text -->
      <div class="home-inner">
        <h1 class="home-heading">
          Hi, I'm Anson — <em>where finance meets design thinking</em>
        </h1>
      </div>

      <!-- CENTRE: square photo + links -->
      <div class="home-centre">
        <img
          src="474770737_584428691124897_854853424259294176_n.png"
          alt="Anson Tsang"
          class="home-photo"
        />
        <nav class="home-links">
          <a href="work.html" class="home-link">Work ↗</a>
          <a href="writing.html" class="home-link">Writing ↗</a>
          <a href="about.html" class="home-link">About ↗</a>
        </nav>
      </div>

      <!-- RIGHT: clocks -->
      <div class="home-clocks">
        <div class="clock-row" data-full="New York">
          <span class="clock-time" id="clockNY"></span>
          <span class="clock-city">JFK</span>
        </div>

        <div class="clock-row" data-full="London">
          <span class="clock-time" id="clockLondon"></span>
          <span class="clock-city">LHR</span>
        </div>
        <div class="clock-row" data-full="Amsterdam">
          <span class="clock-time" id="clockAMS"></span>
          <span class="clock-city">AMS</span>
        </div>
        <div class="clock-row" data-full="Hong Kong">
          <span class="clock-time" id="clockHK"></span>
          <span class="clock-city">HKG</span>
        </div>
        <div class="clock-row" data-full="Kyoto">
          <span class="clock-time" id="clockKyo"></span>
          <span class="clock-city">KIX</span>
        </div>
      </div>
    </main>

    <script>
      /* ── Live clocks ──────────────────────────────────────── */
      const clocks = [
        ["clockNY", "America/New_York"],
        ["clockHK", "Asia/Hong_Kong"],
        ["clockLondon", "Europe/London"],
        ["clockAMS", "Europe/Amsterdam"],
        ["clockKyo", "Asia/Tokyo"],
      ];
      function tick() {
        clocks.forEach(([id, tz]) => {
          document.getElementById(id).textContent =
            new Date().toLocaleTimeString("en-GB", {
              hour: "2-digit",
              minute: "2-digit",
              timeZone: tz,
            });
        });
      }
      tick();
      setInterval(tick, 1000);

      /* ── Typing hover on city codes ───────────────────────── */
      document.querySelectorAll(".clock-row").forEach((row) => {
        const cityEl = row.querySelector(".clock-city");
        const code = cityEl.textContent.trim();
        const full = row.dataset.full;
        let timer = null;

        function typeOut(target, from, step) {
          clearTimeout(timer);
          let i = from;
          function run() {
            i += step;
            if (step > 0 && i >= target.length) {
              cityEl.textContent = target;
              return;
            }
            if (step < 0 && i <= code.length) {
              cityEl.textContent = code;
              return;
            }
            cityEl.textContent = target.slice(0, i);
            timer = setTimeout(run, 38);
          }
          run();
        }

        row.addEventListener("mouseenter", () =>
          typeOut(full, cityEl.textContent.length, 1),
        );
        row.addEventListener("mouseleave", () =>
          typeOut(full, cityEl.textContent.length, -1),
        );
      });
    </script>
  </body>
</html>
